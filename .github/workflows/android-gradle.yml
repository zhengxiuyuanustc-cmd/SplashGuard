name: Android Gradle build and lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "::error::The hosted runner did not provide ANDROID_HOME."
            exit 1
          fi
          sdk_manager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            sdk_manager="$(command -v sdkmanager)"
          fi
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$ANDROID_HOME" --licenses <<'ANDROID_SDK_LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          ANDROID_SDK_LICENSES
          # AGP 8.7 defaults to 34.0.0; install it as well as the API-35 tool version.
          "$sdk_manager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Record Java and Gradle versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          bash ./gradlew --no-daemon --version
      - name: Assemble debug and unsigned release variants, then run Android lint
        shell: bash
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease
      - name: Show the lint text report if validation failed
        if: failure()
        shell: bash
        run: |
          for report in app/build/reports/lint-results-debug.txt app/build/reports/lint-results-release.txt; do
            if [[ -f "$report" ]]; then
              cat "$report"
            fi
          done
