name: Pure Java safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pure Java policies and regression checks
        run: |
          mkdir -p build/pure-tests
          javac -encoding UTF-8 -d build/pure-tests \
            app/src/main/java/org/splashguard/app/AdRules.java \
            app/src/main/java/org/splashguard/app/SkipSession.java \
            app/src/main/java/org/splashguard/app/OnboardingPolicy.java \
            tests/AdRulesTest.java tests/SkipSessionTest.java tests/OnboardingPolicyTest.java
      - name: Run rules, sessions and onboarding checks
        run: |
          java -cp build/pure-tests AdRulesTest
          java -cp build/pure-tests SkipSessionTest
          java -cp build/pure-tests OnboardingPolicyTest
