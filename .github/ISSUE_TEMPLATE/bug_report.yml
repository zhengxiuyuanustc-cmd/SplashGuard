name: 问题反馈
description: 报告广告漏过、误触、设置或后台运行问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有议题。下载与使用无需账号；本次公开提交由 GitHub 要求登录。
        不要上传账号、付款/聊天画面、手机号、IMEI、序列号、PIN、调试凭据或完整日志。截图请先脱敏。
  - type: input
    id: versions
    attributes:
      label: 开屏清净与目标应用版本
      description: 请填写实际安装的版本，不只写“最新版”。
      placeholder: 开屏清净 x.y.z；目标应用名及版本
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机品牌、型号与系统版本
      description: 不需要设备唯一标识；不愿公开的非必要细节可省略。
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: 当前设置与服务状态
      description: 功能开关、无障碍是否连接、是否选中目标应用、是否调整后台运行。
    validations:
      required: true
  - type: dropdown
    id: observed
    attributes:
      label: 实际观察到的情况
      options:
        - 已出现广告，未自动跳过
        - 出现误触或不应发生的操作
        - 已出现广告且自动跳过，但仍有晃动跳转
        - 未出现广告，效果暂不能验证
        - 设置、引导或后台运行异常
        - 其他（在下方说明）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 可重现步骤、期望和实际结果
      description: 包括是否清目标应用后台、熄屏再解锁、划卡或使用系统清理。请区分计数增加与广告确实提前结束。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 最小脱敏证据（可选）
      description: 只提供必要控件信息或已遮盖个人信息的局部画面；不需要完整手机日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查公开内容，不包含私人信息、设备唯一标识或凭据。
          required: true
